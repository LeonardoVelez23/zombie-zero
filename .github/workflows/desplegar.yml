# Despliega a AWS cada vez que algo llega a main: pruebas -> backend (SAM) -> frontend (S3 + CloudFront).
# Requiere en GitHub (Settings -> Secrets and variables -> Actions -> Secrets):
#   AWS_ROLE_ARN   salida RolArn de infra/github-oidc.yaml
#   CORREO_ALERTA  correo del AWS Budget (si falta, el despliegue se detiene para no borrar el Budget)
# Van como Secrets y no como Variables porque el repo es público y los logs de Actions también:
# los secrets salen como *** en los logs; las variables, en claro.
#
# Las acciones van fijadas a un SHA de commit (no a una etiqueta que se pueda mover). Para
# actualizarlas, revisar el changelog de la acción y cambiar el SHA y el comentario de versión.
name: Desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:

# Se despliega solo el último commit de main: si llegan varios merges mientras uno se
# despliega, GitHub deja en cola solo el más reciente y descarta los intermedios. Si ese
# último no pasa las pruebas, producción se queda en el último que sí se desplegó.
concurrency:
  group: desplegar-produccion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Pruebas del backend
        working-directory: backend
        run: uv run --python 3.13 --extra dev pytest -q

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pruebas del frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx ng test --watch=false

  desplegar:
    needs: pruebas
    runs-on: ubuntu-latest
    # Sin "environment:": cambiaría el sub del token OIDC y el rol solo acepta ref:refs/heads/main.
    permissions:
      contents: read
      id-token: write   # token OIDC para asumir el rol de AWS sin llaves
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      CORREO_ALERTA: ${{ secrets.CORREO_ALERTA }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Un "Re-run" de una ejecución vieja no debe pisar una versión más nueva ya desplegada.
      - name: Comprobar que es el último commit de main
        id: vigente
        run: |
          cabeza=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          if [ "$cabeza" = "$GITHUB_SHA" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$GITHUB_SHA ya no es la cabeza de main ($cabeza); no se despliega."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comprobar variables
        if: steps.vigente.outputs.ok == 'true'
        run: |
          [[ "$AWS_ROLE_ARN" == arn:aws:iam::* ]] || { echo "::error::AWS_ROLE_ARN no es un ARN de rol"; exit 1; }
          [ -n "$CORREO_ALERTA" ] || { echo "::error::Falta la variable CORREO_ALERTA (sin ella se borraría el Budget)"; exit 1; }

      # Todo lo que instala dependencias o compila va antes de tener credenciales de AWS.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: steps.vigente.outputs.ok == 'true'
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        if: steps.vigente.outputs.ok == 'true'
        with:
          use-installer: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.vigente.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Empaquetar la Lambda y compilar el frontend
        if: steps.vigente.outputs.ok == 'true'
        run: |
          infra/empaquetar.sh
          (cd frontend && npm ci --no-audit --no-fund && npx ng build)

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        if: steps.vigente.outputs.ok == 'true'
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true   # el número de cuenta no aparece en los logs públicos

      - name: Backend (Lambda, CloudFront, Budget)
        if: steps.vigente.outputs.ok == 'true'
        run: SIN_EMPAQUETAR=1 infra/desplegar.sh

      - name: Frontend (S3 + CloudFront)
        if: steps.vigente.outputs.ok == 'true'
        run: infra/publicar-frontend.sh frontend/dist/zombie-zero-ui/browser
