AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Zombie Zero - simulador de la plaga en Manta. Backend Python en Lambda con
  Function URL, frontend estático en S3 + CloudFront y presupuesto con alerta.

Parameters:
  CorreoAlerta:
    Type: String
    Default: ''
    Description: Correo que recibe la alerta del presupuesto (vacío = no crear el Budget).
  PresupuestoMensualUSD:
    Type: Number
    Default: 10
    Description: Límite mensual del AWS Budget, en dólares.
  ConcurrenciaMaxima:
    Type: Number
    Default: 0
    Description: >
      Ejecuciones simultáneas máximas de la Lambda (protege el costo).
      0 = sin reserva; las cuentas nuevas solo permiten 10 en total y no admiten reservas.

Conditions:
  CrearPresupuesto: !Not [!Equals [!Ref CorreoAlerta, '']]
  LimitarConcurrencia: !Not [!Equals [!Ref ConcurrenciaMaxima, 0]]

Resources:
  # --- Backend: motor de simulación y API ---------------------------------
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: API del simulador (POST /api/simular, POST /api/edp, POST /api/informe)
      CodeUri: .build/lambda/     # lo arma empaquetar.sh (código + numpy para Linux)
      Handler: zombie.api.lambda_handler
      Runtime: python3.13
      Architectures: [x86_64]
      # En Lambda la CPU crece con la memoria: 3.008 MB dan 2 vCPU y los planes se simulan en 2 procesos.
      # Es el máximo que admiten las cuentas nuevas; con el límite levantado, 10.240 MB dan 6 vCPU.
      MemorySize: 3008
      Timeout: 60                 # 100 repeticiones x 10 planes tardan unos 10 s
      ReservedConcurrentExecutions: !If [LimitarConcurrencia, !Ref ConcurrenciaMaxima, !Ref AWS::NoValue]
      LoggingConfig:
        LogGroup: !Ref ApiLogs
      # Informe para el alcalde (POST /api/informe): Bedrock solo redacta lo que ya calculó el motor.
      # Con IA_ACTIVA en 'false', o si Bedrock falla, se responde con una plantilla fija sin IA.
      Environment:
        Variables:
          IA_ACTIVA: 'true'
          MODELO_IA: amazon.nova-micro-v1:0
      Policies:
        - Statement:
            - Effect: Allow             # mínimo privilegio: solo invocar este modelo
              Action: bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-micro-v1:0
      FunctionUrlConfig:          # Function URL: sin el corte de 30 s de API Gateway
        AuthType: NONE
        Cors:
          AllowOrigins: ['*']
          AllowMethods: [GET, POST]
          AllowHeaders: [content-type]
          MaxAge: 3600

  # Las Function URL públicas creadas desde octubre de 2025 también necesitan
  # lambda:InvokeFunction (además del lambda:InvokeFunctionUrl que agrega SAM).
  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api
      RetentionInDays: 7

  # --- Frontend: archivos estáticos privados detrás de CloudFront -----------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-frontend
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Zombie Zero - interfaz web
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          # La API sale por el mismo dominio: el frontend llama a /api/... sin conocer la URL de la Lambda.
          - Id: api
            DomainName: !Select [2, !Split ['/', !GetAtt ApiFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60   # la simulación tarda ~30 s; el valor por defecto (30 s) la cortaría
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # CachingOptimized (administrada por AWS)
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad           # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac   # AllViewerExceptHostHeader (la Function URL rechaza otro Host)
        CustomErrorResponses:     # rutas de Angular: siempre se sirve index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

  # --- Control de costos -----------------------------------------------------
  Presupuesto:
    Type: AWS::Budgets::Budget
    Condition: CrearPresupuesto
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-mensual
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref PresupuestoMensualUSD
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref CorreoAlerta
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref CorreoAlerta

Outputs:
  ApiUrl:
    Description: URL pública de la API (va en el environment de Angular)
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  FrontendUrl:
    Description: URL pública de la interfaz
    Value: !Sub https://${FrontendDistribution.DomainName}
  FrontendBucketName:
    Description: Bucket donde se sube el build de Angular
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Description: Id de CloudFront, para invalidar la caché al publicar
    Value: !Ref FrontendDistribution
