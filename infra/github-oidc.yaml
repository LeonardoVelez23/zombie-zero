AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Zombie Zero - acceso de GitHub Actions a AWS por OIDC (sin llaves guardadas).
  Solo la rama main del repositorio puede asumir el rol. Se despliega una vez:
  aws cloudformation deploy --template-file infra/github-oidc.yaml
    --stack-name zombie-zero-github-oidc --capabilities CAPABILITY_NAMED_IAM

Parameters:
  Repositorio:
    Type: String
    Default: LeonardoVelez23/zombie-zero
    Description: Repositorio de GitHub (usuario/repo) que puede desplegar.
  RepositorioConIds:
    Type: String
    Default: LeonardoVelez23@126128766/zombie-zero@1434829139
    Description: >
      El mismo repositorio con los ids inmutables de usuario y repo, como GitHub los
      pone ahora en el "sub" del token (usuario@id/repo@id). Se ven en CloudTrail.
  Rama:
    Type: String
    Default: main
    Description: Única rama autorizada a desplegar.
  Pila:
    Type: String
    Default: zombie-zero
    Description: Nombre de la pila de la aplicación (prefijo de los recursos que se pueden tocar).
  DistribucionId:
    Type: String
    Default: E2MEEF4Z6XQ9XM
    Description: Id de la distribución de CloudFront de la pila (salida FrontendDistributionId).
  OacId:
    Type: String
    Default: E3G28K5KO11Y7C
    Description: Id del Origin Access Control de CloudFront de la pila.
  CorreoAlerta:
    Type: String
    Description: Correo que recibe el aviso cuando se corta Bedrock por gasto.
  RolLambda:
    Type: String
    Description: >
      Nombre del rol de ejecución de la Lambda (recurso ApiFunctionRole de la pila de la
      aplicación). La acción de presupuesto le niega Bedrock si se pasa el límite.
  LimiteBedrock:
    Type: Number
    Default: 3
    Description: Gasto mensual máximo en Bedrock, en dólares; al superarlo se corta la IA.

Resources:
  # Una cuenta solo admite un proveedor por URL: si ya existe, quitar este recurso y usar su ARN.
  ProveedorGitHub:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  RolDespliegue:
    Type: AWS::IAM::Role
    Properties:
      RoleName: zombie-zero-github-despliegue
      Description: Rol que asume GitHub Actions al desplegar desde main
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref ProveedorGitHub
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Se aceptan los dos formatos del sub: con ids (actual) y solo con nombres.
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${RepositorioConIds}:ref:refs/heads/${Rama}
                  - !Sub repo:${Repositorio}:ref:refs/heads/${Rama}
      Policies:
        - PolicyName: desplegar-zombie-zero
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # sam deploy: la pila de la app y la de SAM (bucket de artefactos)
              - Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Pila}/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                Resource: '*'
              # Cada servicio queda limitado a los recursos de esta aplicación. Si template.yaml
              # agrega otro tipo de recurso, hay que ampliar esta política (con un administrador).
              # Nombres exactos de los recursos que crea template.yaml: "${Pila}-*" a secas también
              # alcanzaría recursos ajenos con el mismo prefijo (p. ej. el bucket zombie-zero-manta-2026).
              - Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Pila}-ApiFunction-*
              - Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub arn:aws:s3:::${Pila}-frontendbucket-*
                  - !Sub arn:aws:s3:::${Pila}-frontendbucket-*/*
                  - !Sub arn:aws:s3:::${Pila}-resultados-${AWS::AccountId}
                  - !Sub arn:aws:s3:::${Pila}-resultados-${AWS::AccountId}/*
                  - arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*
                  - arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*
              - Effect: Allow
                Action: logs:*
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Pila}-api
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Pila}-api:*
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              # Resultados: la base y la tabla de Glue y el grupo de trabajo de Athena.
              - Effect: Allow
                Action:
                  - glue:CreateDatabase
                  - glue:GetDatabase
                  - glue:UpdateDatabase
                  - glue:DeleteDatabase
                  - glue:CreateTable
                  - glue:GetTable
                  - glue:UpdateTable
                  - glue:DeleteTable
                  - glue:GetPartitions
                  - glue:BatchDeletePartition
                Resource:
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/zombie_zero
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/zombie_zero/*
              - Effect: Allow
                Action:
                  - athena:CreateWorkGroup
                  - athena:GetWorkGroup
                  - athena:UpdateWorkGroup
                  - athena:DeleteWorkGroup
                  - athena:TagResource
                  - athena:UntagResource
                  - athena:ListTagsForResource
                Resource: !Sub arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${Pila}
              # Monitoreo: las alarmas, el dashboard y el tema SNS de avisos de esta pila.
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                  - cloudwatch:ListTagsForResource
                Resource: !Sub arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${Pila}-*-api
              - Effect: Allow
                Action:
                  - cloudwatch:PutDashboard
                  - cloudwatch:GetDashboard
                  - cloudwatch:DeleteDashboards
                Resource: !Sub arn:aws:cloudwatch::${AWS::AccountId}:dashboard/${Pila}
              - Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:ListDashboards
                Resource: '*'
              - Effect: Allow
                Action: sns:*
                Resource: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${Pila}-avisos
              - Effect: Allow
                Action: budgets:*
                Resource: !Sub arn:aws:budgets::${AWS::AccountId}:budget/${Pila}-mensual
              # CloudFront: solo actualizar la distribución y el OAC existentes (crearlos de nuevo
              # requiere un administrador).
              - Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                  - cloudfront:ListTagsForResource
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetOriginAccessControlConfig
                  - cloudfront:UpdateOriginAccessControl
                Resource:
                  - !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistribucionId}
                  - !Sub arn:aws:cloudfront::${AWS::AccountId}:origin-access-control/${OacId}
              - Effect: Allow
                Action:
                  - cloudfront:GetCachePolicy
                  - cloudfront:GetOriginRequestPolicy
                Resource: '*'
              # IAM: sin crear roles ni escribir políticas (evita escalar a administrador).
              # Solo puede entregar a Lambda el rol de ejecución que ya existe y adjuntarle
              # o quitarle dos políticas fijas, definidas abajo: invocar Bedrock y guardar resultados.
              - Effect: Allow
                Action: iam:GetRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${Pila}-ApiFunctionRole-*
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${Pila}-ApiFunctionRole-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${Pila}-ApiFunctionRole-*
                Condition:
                  ArnEquals:
                    iam:PolicyARN:
                      - !Ref PoliticaBedrock
                      - !Ref PoliticaResultados

  # Lo único que la Lambda puede hacer en Bedrock: invocar nova-micro para redactar el informe.
  PoliticaBedrock:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${Pila}-invocar-bedrock
      Description: Zombie Zero - la Lambda solo puede invocar amazon.nova-micro-v1:0
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: bedrock:InvokeModel
            Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-micro-v1:0

  # Lo único que la Lambda puede hacer con los resultados: escribir resúmenes nuevos y leerlos
  # para el historial. No puede borrar ni tocar nada fuera de simulaciones/.
  PoliticaResultados:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${Pila}-guardar-resultados
      Description: Zombie Zero - la Lambda solo puede escribir y leer en simulaciones/ del bucket de resultados
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [s3:PutObject, s3:GetObject]
            Resource: !Sub arn:aws:s3:::${Pila}-resultados-${AWS::AccountId}/simulaciones/*
          - Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub arn:aws:s3:::${Pila}-resultados-${AWS::AccountId}
            Condition:
              StringLike:
                s3:prefix: simulaciones/*

  # --- Corte de gasto de Bedrock para toda la cuenta ------------------------------------------
  # La Function URL es pública y el cupo de llamadas a Bedrock es por contenedor. Si el gasto real
  # en Bedrock del mes supera LimiteBedrock, AWS Budgets adjunta sola esta política al rol de la
  # Lambda: Bedrock queda negado y el informe se sigue entregando con la plantilla sin IA.
  PoliticaSinBedrock:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${Pila}-sin-bedrock
      Description: Zombie Zero - corte de gasto, niega invocar Bedrock
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Action: bedrock:InvokeModel
            Resource: '*'

  PresupuestoBedrock:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub ${Pila}-bedrock
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref LimiteBedrock
          Unit: USD
        CostFilters:
          Service:
            - Amazon Bedrock

  # Rol con el que AWS Budgets aplica el corte: solo puede adjuntar o quitar la política de corte.
  RolCorteBedrock:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Pila}-corte-bedrock
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: aplicar-corte
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${RolLambda}
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Ref PoliticaSinBedrock

  CorteBedrock:
    Type: AWS::Budgets::BudgetsAction
    Properties:
      BudgetName: !Ref PresupuestoBedrock
      NotificationType: ACTUAL
      ActionType: APPLY_IAM_POLICY
      ActionThreshold:
        Type: PERCENTAGE
        Value: 100
      ApprovalModel: AUTOMATIC
      ExecutionRoleArn: !GetAtt RolCorteBedrock.Arn
      Definition:
        IamActionDefinition:
          PolicyArn: !Ref PoliticaSinBedrock
          Roles:
            - !Ref RolLambda
      Subscribers:
        - Type: EMAIL
          Address: !Ref CorreoAlerta

Outputs:
  RolArn:
    Description: Va en la variable AWS_ROLE_ARN del repositorio en GitHub
    Value: !GetAtt RolDespliegue.Arn
