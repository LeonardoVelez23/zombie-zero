AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Zombie Zero - acceso de GitHub Actions a AWS por OIDC (sin llaves guardadas).
  Solo la rama main del repositorio puede asumir el rol. Se despliega una vez:
  aws cloudformation deploy --template-file infra/github-oidc.yaml
    --stack-name zombie-zero-github-oidc --capabilities CAPABILITY_NAMED_IAM

Parameters:
  Repositorio:
    Type: String
    Default: LeonardoVelez23/zombie-zero
    Description: Repositorio de GitHub (usuario/repo) que puede desplegar.
  RepositorioConIds:
    Type: String
    Default: LeonardoVelez23@126128766/zombie-zero@1434829139
    Description: >
      El mismo repositorio con los ids inmutables de usuario y repo, como GitHub los
      pone ahora en el "sub" del token (usuario@id/repo@id). Se ven en CloudTrail.
  Rama:
    Type: String
    Default: main
    Description: Única rama autorizada a desplegar.
  Pila:
    Type: String
    Default: zombie-zero
    Description: Nombre de la pila de la aplicación (prefijo de los recursos que se pueden tocar).
  DistribucionId:
    Type: String
    Default: E2MEEF4Z6XQ9XM
    Description: Id de la distribución de CloudFront de la pila (salida FrontendDistributionId).
  OacId:
    Type: String
    Default: E3G28K5KO11Y7C
    Description: Id del Origin Access Control de CloudFront de la pila.

Resources:
  # Una cuenta solo admite un proveedor por URL: si ya existe, quitar este recurso y usar su ARN.
  ProveedorGitHub:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  RolDespliegue:
    Type: AWS::IAM::Role
    Properties:
      RoleName: zombie-zero-github-despliegue
      Description: Rol que asume GitHub Actions al desplegar desde main
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref ProveedorGitHub
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Se aceptan los dos formatos del sub: con ids (actual) y solo con nombres.
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${RepositorioConIds}:ref:refs/heads/${Rama}
                  - !Sub repo:${Repositorio}:ref:refs/heads/${Rama}
      Policies:
        - PolicyName: desplegar-zombie-zero
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # sam deploy: la pila de la app y la de SAM (bucket de artefactos)
              - Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Pila}/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                Resource: '*'
              # Cada servicio queda limitado a los recursos de esta aplicación. Si template.yaml
              # agrega otro tipo de recurso, hay que ampliar esta política (con un administrador).
              - Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Pila}-*
              - Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub arn:aws:s3:::${Pila}-*
                  - !Sub arn:aws:s3:::${Pila}-*/*
                  - arn:aws:s3:::aws-sam-cli-managed-default-*
                  - arn:aws:s3:::aws-sam-cli-managed-default-*/*
              - Effect: Allow
                Action: logs:*
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Pila}-*
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Pila}-*:*
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              - Effect: Allow
                Action: budgets:*
                Resource: !Sub arn:aws:budgets::${AWS::AccountId}:budget/${Pila}-*
              # CloudFront: solo actualizar la distribución y el OAC existentes (crearlos de nuevo
              # requiere un administrador).
              - Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                  - cloudfront:ListTagsForResource
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetOriginAccessControlConfig
                  - cloudfront:UpdateOriginAccessControl
                Resource:
                  - !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistribucionId}
                  - !Sub arn:aws:cloudfront::${AWS::AccountId}:origin-access-control/${OacId}
              - Effect: Allow
                Action:
                  - cloudfront:GetCachePolicy
                  - cloudfront:GetOriginRequestPolicy
                Resource: '*'
              # IAM: sin crear roles ni adjuntar políticas (evita escalar a administrador).
              # Solo puede entregar a Lambda el rol de ejecución que ya existe.
              - Effect: Allow
                Action: iam:GetRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${Pila}-ApiFunctionRole-*
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${Pila}-ApiFunctionRole-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com

Outputs:
  RolArn:
    Description: Va en la variable AWS_ROLE_ARN del repositorio en GitHub
    Value: !GetAtt RolDespliegue.Arn
