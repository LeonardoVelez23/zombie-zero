@if (resultado()) {
  <div class="linea-tiempo" role="group" aria-label="Línea de tiempo del brote">
    <button
      type="button"
      class="reproducir"
      [attr.aria-pressed]="reloj.reproduciendo()"
      [attr.aria-label]="reloj.reproduciendo() ? 'Pausar el brote' : 'Reproducir el brote'"
      [disabled]="reloj.total() < 1"
      (click)="reloj.alternar()"
    >
      {{ reloj.reproduciendo() ? '❚❚' : '▶' }}
    </button>

    <div class="dia" [class.en-vivo]="reloj.reproduciendo()">
      <span class="estado"
        ><span class="senal" aria-hidden="true"></span
        >{{ reloj.reproduciendo() ? 'EN VIVO' : 'PAUSA' }}</span
      >
      <strong>Día {{ reloj.dia() }}</strong>
      <small>de {{ reloj.total() }}</small>
    </div>

    <div class="pista">
      <input
        type="range"
        min="0"
        [max]="reloj.total()"
        [value]="reloj.dia()"
        aria-label="Día que se muestra en todas las pantallas"
        (input)="reloj.irA(+$any($event.target).value)"
      />
      <div class="hitos">
        @for (h of hitos(); track h.dia) {
          <button
            type="button"
            class="hito"
            [class.actual]="reloj.dia() === h.dia"
            [style.left.%]="posicion(h.dia)"
            [title]="h.nombre + ' (día ' + h.dia + ')'"
            (click)="reloj.irA(h.dia)"
          >
            <span class="marca" aria-hidden="true"></span>
            <span class="texto">{{ h.nombre }}</span>
          </button>
        }
      </div>
    </div>

    <select
      aria-label="Velocidad de la reproducción"
      [value]="reloj.velocidad()"
      (change)="reloj.cambiarVelocidad(+$any($event.target).value)"
    >
      @for (v of velocidades; track v.ms) {
        <option [value]="v.ms">{{ v.nombre }}</option>
      }
    </select>
  </div>
}
