@if (informe(); as i) {
  <figure class="informe-ia" [class.sin-ia]="i.fuente === 'local'" aria-live="polite">
    <blockquote>
      {{ i.texto }}
      @if (redactando()) {
        <span class="cursor" aria-hidden="true">▍</span>
      }
    </blockquote>
    <figcaption>
      <span class="fuente">{{ etiqueta() }}</span>
      @if (i.aviso) {
        <span class="aviso" role="status">{{ i.aviso }}</span>
      }
      <span>Las cifras salen de la simulación; el texto solo las explica.</span>
    </figcaption>
  </figure>
} @else {
  <button type="button" class="explicar" [disabled]="redactando()" (click)="explicar()">
    {{ redactando() ? 'Redactando…' : 'Explicar al alcalde' }}
  </button>
  @if (error(); as mensaje) {
    <p class="error" role="alert">No se pudo redactar el informe: {{ mensaje }}</p>
  }
}
